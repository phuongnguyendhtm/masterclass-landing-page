<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bộ Prompt Marketing Toàn Diện · FreeUp Academy</title>
<meta name="description" content="SOP hướng dẫn dùng 8 prompt marketing theo quy trình 5 giai đoạn từ nghiên cứu đến sáng tạo nội dung." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #00A86B;
  --primary-dk: #00704A;
  --primary-darker: #004B30;
  --primary-lt: #4DD9A0;
  --primary-soft: #E8F8EE;
  --primary-softer: #F4FBF7;
  --navy: #1A3C6E;
  --navy-deep: #0F2547;

  --stage-1: #1A3C6E;
  --stage-2: #00704A;
  --stage-3: #00A86B;
  --stage-4: #26B57F;
  --stage-5: #4DD9A0;

  --bg: #FAFAF7;
  --surface: #FFFFFF;
  --surface-2: #F5F5F0;
  --ink: #0F172A;
  --ink-2: #334155;
  --muted: #64748B;
  --line: #E5E7EB;
  --line-soft: #F1F5F9;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow: 0 4px 16px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 16px 48px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.06);

  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Be Vietnam Pro', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: 100px; }

body {
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "kern", "liga", "ss01";
}

/* Subtle paper-grain background texture */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(0,168,107,0.03) 1px, transparent 0);
  background-size: 24px 24px;
  pointer-events: none;
  z-index: 0;
}

/* ==================== STICKY HEADER ==================== */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
  transition: box-shadow .2s ease;
}
.topbar.scrolled { box-shadow: var(--shadow); }

.topbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 32px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 32px;
}

.brand {
  display: flex; align-items: center; gap: 12px;
  text-decoration: none; color: inherit;
}
.brand img {
  width: 40px; height: 40px;
  display: block;
}
.brand-text {
  display: flex; flex-direction: column; line-height: 1.1;
}
.brand-name {
  font-weight: 700; font-size: 15px;
  letter-spacing: -0.01em;
}
.brand-tagline {
  font-size: 11.5px; color: var(--muted);
  font-weight: 500; letter-spacing: 0.02em;
}

.progress-pill {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  background: var(--primary-softer);
  border: 1px solid var(--primary-soft);
  border-radius: 100px;
  font-size: 13px;
}
.progress-pill .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 0 4px rgba(0, 168, 107, 0.15);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  50% { box-shadow: 0 0 0 8px rgba(0, 168, 107, 0); }
}
.progress-pill strong { color: var(--primary-dk); font-weight: 700; }
.progress-pill span { color: var(--ink-2); }
.progress-bar {
  flex: 1; max-width: 120px;
  height: 6px; background: var(--primary-soft);
  border-radius: 3px; overflow: hidden;
}
.progress-bar .fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-dk), var(--primary));
  border-radius: 3px;
  transition: width .4s cubic-bezier(.2,.8,.2,1);
}

.topbar-actions {
  display: flex; align-items: center; gap: 8px;
}
.btn-icon {
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  cursor: pointer; transition: all .15s ease;
  color: var(--ink-2);
}
.btn-icon:hover { background: var(--primary-soft); border-color: var(--primary-lt); color: var(--primary-dk); }
.btn-icon svg { width: 16px; height: 16px; }

/* ==================== HERO ==================== */
.hero {
  position: relative;
  padding: 80px 32px 60px;
  max-width: 1280px;
  margin: 0 auto;
  z-index: 1;
}

.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--primary-dk);
  background: var(--primary-soft);
  border-radius: 100px;
  margin-bottom: 24px;
}
.hero-eyebrow::before {
  content: ""; width: 6px; height: 6px;
  background: var(--primary); border-radius: 50%;
}

.hero-title {
  font-family: var(--serif);
  font-size: clamp(40px, 6vw, 76px);
  font-weight: 500;
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--navy-deep);
  margin-bottom: 24px;
  max-width: 920px;
}
.hero-title em {
  font-style: italic;
  color: var(--primary);
  font-weight: 400;
  position: relative;
}
.hero-title em::after {
  content: "";
  position: absolute; bottom: 0.05em; left: 0; right: 0;
  height: 0.08em;
  background: var(--primary-lt);
  opacity: 0.3;
  border-radius: 2px;
}

.hero-lede {
  font-size: 19px;
  color: var(--ink-2);
  max-width: 680px;
  line-height: 1.6;
  margin-bottom: 40px;
  font-weight: 400;
}

.hero-meta {
  display: flex; flex-wrap: wrap; gap: 28px;
  padding: 24px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-bottom: 56px;
}
.hero-meta-item {
  display: flex; flex-direction: column; gap: 4px;
}
.hero-meta-num {
  font-family: var(--serif);
  font-size: 28px; font-weight: 600;
  color: var(--primary-dk);
  line-height: 1;
}
.hero-meta-label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ==================== STAGE FLOW ==================== */
.flow-section {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px 60px;
  position: relative;
  z-index: 1;
}
.section-label {
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--primary);
  margin-bottom: 12px;
}
.section-title {
  font-family: var(--serif);
  font-size: clamp(28px, 3.5vw, 42px);
  font-weight: 500;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 12px;
}
.section-subtitle {
  font-size: 17px;
  color: var(--ink-2);
  max-width: 720px;
  margin-bottom: 40px;
  line-height: 1.55;
}

.flow-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-top: 32px;
}
.flow-card {
  position: relative;
  padding: 24px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  cursor: pointer;
  transition: all .25s cubic-bezier(.2,.8,.2,1);
  text-decoration: none;
  color: inherit;
  display: flex; flex-direction: column;
  min-height: 200px;
  overflow: hidden;
}
.flow-card::before {
  content: ""; position: absolute;
  top: 0; left: 0; right: 0; height: 4px;
  background: var(--stage-color);
  opacity: 0.85;
}
.flow-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: var(--stage-color);
}
.flow-card-num {
  font-family: var(--serif);
  font-size: 38px;
  font-weight: 600;
  color: var(--stage-color);
  line-height: 1;
  margin-bottom: 12px;
  letter-spacing: -0.02em;
}
.flow-card-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.flow-card-title {
  font-size: 15px; font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.25;
  margin-bottom: 8px;
}
.flow-card-sub {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.45;
  flex: 1;
}
.flow-card-foot {
  margin-top: 16px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 500;
}
.flow-card-status {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  background: var(--surface-2);
  border-radius: 100px;
  font-weight: 600;
}
.flow-card-status.done {
  background: var(--primary-soft);
  color: var(--primary-dk);
}

/* ==================== SECTION DIVIDER ==================== */
.divider {
  max-width: 1280px;
  margin: 60px auto;
  padding: 0 32px;
}
.divider-line {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
}

/* ==================== FORM SECTION ==================== */
.form-section {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px 60px;
  position: relative;
  z-index: 1;
}
.form-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 40px;
  position: relative;
  overflow: hidden;
}
.form-card::before {
  content: ""; position: absolute;
  top: 0; left: 0; right: 0; height: 5px;
  background: linear-gradient(90deg, var(--stage-1), var(--stage-2), var(--stage-3), var(--stage-4), var(--stage-5));
}

.form-card-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 32px; margin-bottom: 32px; flex-wrap: wrap;
}
.form-card-head h3 {
  font-family: var(--serif);
  font-size: 32px; font-weight: 500;
  letter-spacing: -0.02em; line-height: 1.15;
  color: var(--ink); margin-bottom: 8px;
}
.form-card-head p {
  font-size: 15px; color: var(--ink-2);
  max-width: 640px; line-height: 1.55;
}

.save-status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: var(--primary-softer);
  border: 1px solid var(--primary-soft);
  border-radius: 100px;
  font-size: 13px; font-weight: 500;
  color: var(--primary-dk);
  white-space: nowrap;
}
.save-status .icon { width: 14px; height: 14px; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px 24px;
}
.form-grid .full { grid-column: 1 / -1; }

.field label {
  display: block;
  font-size: 12.5px; font-weight: 600;
  color: var(--ink); margin-bottom: 6px;
  letter-spacing: 0.01em;
}
.field label .req {
  color: var(--primary);
  margin-left: 2px;
}
.field .hint {
  font-size: 12px; color: var(--muted);
  margin-top: 5px;
  font-weight: 400;
}
.field input, .field textarea, .field select {
  width: 100%;
  padding: 11px 14px;
  font-family: var(--sans);
  font-size: 14.5px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: all .15s ease;
  resize: vertical;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
}
.field input::placeholder, .field textarea::placeholder {
  color: #94A3B8;
}
.field textarea { min-height: 80px; line-height: 1.5; }

.form-foot {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  display: flex; gap: 12px; flex-wrap: wrap;
  align-items: center; justify-content: space-between;
}
.form-foot-text {
  font-size: 13px; color: var(--muted);
}
.form-foot-actions { display: flex; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px;
  font-family: var(--sans);
  font-size: 14px; font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all .15s ease;
  text-decoration: none;
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}
.btn-primary:hover { background: var(--navy-deep); }
.btn-ghost {
  background: var(--surface);
  color: var(--ink-2);
  border-color: var(--line);
}
.btn-ghost:hover { background: var(--surface-2); border-color: var(--ink-2); color: var(--ink); }
.btn svg { width: 14px; height: 14px; }

/* ==================== STAGE / PROMPTS ==================== */
.stages-section {
  max-width: 1280px;
  margin: 0 auto;
  padding: 40px 32px 80px;
  position: relative;
  z-index: 1;
}
.stage-block {
  margin-bottom: 80px;
  scroll-margin-top: 100px;
}
.stage-block:last-child { margin-bottom: 0; }

.stage-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
  padding: 28px 32px;
  background: linear-gradient(135deg, var(--stage-color), var(--stage-color-dk));
  color: white;
  border-radius: 20px;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
.stage-head::after {
  content: "";
  position: absolute;
  top: -50%; right: -10%; width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 60%);
  pointer-events: none;
}
.stage-head-num {
  position: relative;
  width: 64px; height: 64px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.3);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.02em;
  backdrop-filter: blur(4px);
}
.stage-head-text { position: relative; }
.stage-head-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  opacity: 0.85;
  margin-bottom: 6px;
}
.stage-head-title {
  font-family: var(--serif);
  font-size: 28px; font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 6px;
}
.stage-head-sub {
  font-size: 14.5px;
  opacity: 0.92;
  font-weight: 400;
}
.stage-head-stats {
  position: relative;
  text-align: right;
}
.stage-head-progress {
  font-family: var(--serif);
  font-size: 36px; font-weight: 600;
  line-height: 1;
  letter-spacing: -0.03em;
}
.stage-head-progress span { font-size: 18px; opacity: 0.7; font-weight: 500; }
.stage-head-progress-label {
  font-size: 11px; opacity: 0.85;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 4px;
}

/* ==================== PROMPT CARD ==================== */
.prompt-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color .2s ease;
  scroll-margin-top: 100px;
}
.prompt-card.done {
  border-color: var(--primary-lt);
  background: linear-gradient(180deg, var(--primary-softer) 0%, var(--surface) 100%);
}

.prompt-head {
  padding: 24px 28px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 20px;
  cursor: pointer;
  user-select: none;
}
.prompt-head:hover { background: var(--surface-2); }
.prompt-card.done .prompt-head:hover { background: var(--primary-soft); }

.prompt-id {
  display: flex; align-items: center; justify-content: center;
  width: 52px; height: 52px;
  border-radius: 12px;
  background: var(--stage-color);
  color: white;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}
.prompt-card.done .prompt-id::after {
  content: "✓";
  position: relative;
  font-size: 18px; margin-left: 4px;
}

.prompt-head-text { flex: 1; min-width: 0; }
.prompt-meta {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.prompt-meta strong { color: var(--stage-color); }
.prompt-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.015em;
  color: var(--ink);
  line-height: 1.2;
}

.prompt-head-actions {
  display: flex; align-items: center; gap: 10px;
}
.check-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 100px;
  font-size: 13px; font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  transition: all .15s ease;
}
.check-toggle:hover { border-color: var(--ink-2); color: var(--ink); }
.check-toggle.checked {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.check-toggle .check-icon {
  width: 16px; height: 16px;
  border: 1.5px solid currentColor;
  border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.check-toggle.checked .check-icon {
  background: white;
  border-color: white;
  color: var(--primary);
}
.check-toggle.checked .check-icon::after {
  content: "✓";
  font-size: 12px; font-weight: 700;
}

.expand-toggle {
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  transition: all .15s ease;
  color: var(--muted);
}
.expand-toggle:hover { background: var(--surface-2); color: var(--ink); }
.expand-toggle svg {
  width: 14px; height: 14px;
  transition: transform .2s ease;
}
.prompt-card.expanded .expand-toggle svg { transform: rotate(180deg); }

/* ==================== PROMPT BODY ==================== */
.prompt-body {
  display: none;
  padding: 0 28px 28px;
  border-top: 1px solid var(--line);
  margin-top: 0;
}
.prompt-card.expanded .prompt-body { display: block; }

.info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 24px 0;
}
.info-cell {
  padding: 16px 18px;
  background: var(--surface-2);
  border-radius: 14px;
  border: 1px solid var(--line-soft);
}
.info-cell-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--stage-color);
  margin-bottom: 8px;
}
.info-cell-text {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.55;
}

.code-section {
  margin: 24px 0 16px;
}
.code-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 12px; flex-wrap: wrap;
}
.code-head-label {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink);
}
.code-head-label::before {
  content: ""; width: 4px; height: 16px;
  background: var(--stage-color);
  border-radius: 2px;
}
.fill-status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: var(--primary-soft);
  color: var(--primary-dk);
  border-radius: 100px;
  font-size: 11.5px; font-weight: 600;
}
.fill-status.warn {
  background: #FEF3C7;
  color: #92400E;
}
.fill-status .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
}

.code-block {
  position: relative;
  background: var(--navy-deep);
  border-radius: 16px;
  padding: 24px 28px;
  font-family: var(--mono);
  font-size: 13.5px;
  line-height: 1.7;
  color: #D1FAE5;
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 480px;
  overflow-y: auto;
  border: 1px solid #1F4D38;
  scrollbar-width: thin;
  scrollbar-color: #2D6B53 transparent;
}
.code-block::-webkit-scrollbar { width: 8px; }
.code-block::-webkit-scrollbar-thumb { background: #2D6B53; border-radius: 4px; }
.code-block .placeholder {
  display: inline;
  background: rgba(255, 200, 0, 0.18);
  color: #FFD980;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 500;
}
.code-block .filled {
  display: inline;
  background: rgba(77, 217, 160, 0.14);
  color: #6EE7B7;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 500;
}

.copy-btn {
  position: absolute;
  top: 16px; right: 16px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #E8F8EE;
  border-radius: 8px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s ease;
  backdrop-filter: blur(8px);
}
.copy-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.25);
}
.copy-btn.copied {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.copy-btn svg { width: 13px; height: 13px; }

.tip-box {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 18px 22px;
  background: #FFF8E1;
  border: 1px solid #FFE082;
  border-left: 4px solid #FFB300;
  border-radius: 12px;
  margin: 16px 0;
}
.tip-box-icon {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 1px;
}
.tip-box-text {
  flex: 1;
  font-size: 14px;
  color: #6B4D04;
  line-height: 1.55;
}
.tip-box-text strong { color: #5C3F00; }

.notes-section {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px dashed var(--line);
}
.notes-section label {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
  letter-spacing: 0.01em;
}
.notes-section label::before {
  content: "📝"; font-size: 14px;
}
.notes-section textarea {
  width: 100%;
  padding: 12px 14px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  resize: vertical;
  min-height: 80px;
  line-height: 1.55;
}
.notes-section textarea:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.1);
}

/* ==================== TIPS / EXERCISES ==================== */
.bonus-section {
  max-width: 1280px;
  margin: 0 auto;
  padding: 40px 32px 80px;
  position: relative;
  z-index: 1;
}
.bonus-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.bonus-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  display: flex; gap: 16px;
  align-items: flex-start;
  transition: all .2s ease;
}
.bonus-card:hover {
  border-color: var(--primary-lt);
  box-shadow: var(--shadow);
}
.bonus-card-num {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 600;
  color: var(--primary);
  line-height: 1;
  letter-spacing: -0.02em;
  flex-shrink: 0;
  font-variant-numeric: lining-nums;
}
.bonus-card-content { flex: 1; }
.bonus-card-title {
  font-size: 16px; font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
  letter-spacing: -0.005em;
}
.bonus-card-text {
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.55;
}

/* ==================== FOOTER ==================== */
.footer {
  background: var(--navy-deep);
  color: rgba(255, 255, 255, 0.85);
  padding: 60px 32px 40px;
  position: relative;
  overflow: hidden;
}
.footer::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--stage-1), var(--stage-2), var(--stage-3), var(--stage-4), var(--stage-5));
}
.footer-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 48px;
}
.footer-brand img {
  width: 56px; height: 56px;
  margin-bottom: 16px;
  filter: brightness(0) invert(1);
  opacity: 0.92;
}
.footer-brand h4 {
  font-family: var(--serif);
  font-size: 24px; font-weight: 500;
  margin-bottom: 8px;
  letter-spacing: -0.015em;
  color: white;
}
.footer-brand p {
  font-size: 14px;
  line-height: 1.6;
  max-width: 420px;
  color: rgba(255, 255, 255, 0.7);
}

.footer-col h5 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--primary-lt);
  margin-bottom: 16px;
}
.footer-col ul { list-style: none; }
.footer-col li {
  margin-bottom: 10px;
  font-size: 14px;
}
.footer-col a {
  color: rgba(255, 255, 255, 0.75);
  text-decoration: none;
  transition: color .15s ease;
}
.footer-col a:hover { color: white; }

.footer-bottom {
  max-width: 1280px;
  margin: 40px auto 0;
  padding-top: 24px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  display: flex; justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.55);
}

/* ==================== TOAST ==================== */
.toast {
  position: fixed;
  bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(120%);
  padding: 14px 22px;
  background: var(--ink);
  color: white;
  border-radius: 100px;
  font-size: 14px; font-weight: 500;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 10px;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
  z-index: 200;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
.toast.success { background: var(--primary-dk); }
.toast svg { width: 16px; height: 16px; }

/* ==================== STAGE COLOR MAPPING ==================== */
[data-stage="1"] { --stage-color: var(--stage-1); --stage-color-dk: #122847; }
[data-stage="2"] { --stage-color: var(--stage-2); --stage-color-dk: #004D33; }
[data-stage="3"] { --stage-color: var(--stage-3); --stage-color-dk: #00754D; }
[data-stage="4"] { --stage-color: var(--stage-4); --stage-color-dk: #1A8A5F; }
[data-stage="5"] { --stage-color: var(--stage-5); --stage-color-dk: #2DB57F; }

/* ==================== RESPONSIVE ==================== */
@media (max-width: 980px) {
  .topbar-inner { padding: 12px 20px; gap: 16px; grid-template-columns: auto 1fr auto; }
  .progress-pill { padding: 6px 12px; font-size: 12px; }
  .progress-bar { display: none; }
  .brand-tagline { display: none; }
  .hero { padding: 56px 20px 40px; }
  .flow-section, .form-section, .stages-section, .bonus-section { padding-left: 20px; padding-right: 20px; }
  .flow-grid { grid-template-columns: repeat(2, 1fr); }
  .flow-card { min-height: auto; }
  .form-card, .stage-head { padding: 24px; }
  .form-grid { grid-template-columns: 1fr; }
  .info-grid { grid-template-columns: 1fr; }
  .stage-head { grid-template-columns: 1fr; gap: 16px; }
  .stage-head-stats { text-align: left; }
  .prompt-head { padding: 20px; gap: 14px; grid-template-columns: auto 1fr; }
  .prompt-head-actions { grid-column: 1 / -1; justify-content: flex-end; }
  .prompt-body { padding: 0 20px 24px; }
  .bonus-grid { grid-template-columns: 1fr; }
  .footer-inner { grid-template-columns: 1fr; gap: 32px; }
  .code-block { padding: 18px 20px; font-size: 12.5px; }
  .copy-btn { top: 12px; right: 12px; }
}

@media print {
  .topbar, .footer, .copy-btn, .check-toggle, .expand-toggle, .form-foot-actions, .toast { display: none !important; }
  .prompt-card { break-inside: avoid; }
  .prompt-body { display: block !important; }
}
</style>
</head>

    ]
  },
  {
    id: 2, name: "Thiết kế mồi nhử (Lead Magnet)", short: "Lead Magnet",
    desc: "Đổi giá trị lấy thông tin liên hệ, xây dựng phễu khách hàng.",
    prompts: [
      {
        id: "P3", title: "Ý tưởng Mồi nhử thu hút",
        desc: "Gợi ý 5 định dạng mồi nhử không thể chối từ để lấy data.",
        template: `Mô hình kinh doanh của tôi là [businessModel]. 
Tôi cần tạo Lead Magnet (Mồi nhử) để thu thập thông tin của tệp [persona].

Hãy đề xuất 5 ý tưởng Lead Magnet có "Giá trị cao - Dễ tiêu thụ".
Các định dạng gợi ý: Ebook, Checklist, Template, Mini-course, Mini-tool, Voucher đặc biệt...
Mỗi ý tưởng cần có:
- Tên mồi nhử (Giật tít, hấp dẫn).
- Nó giải quyết 1 nỗi đau cụ thể nào (lấy từ output P1)?
- Format nào là phù hợp nhất và tại sao?`
      }
    ]
  },
  {
    id: 3, name: "Chiến lược nội dung (Content Strategy)", short: "Strategy",
    desc: "Xác định các trụ cột nội dung để định hướng cho toàn bộ kênh.",
    prompts: [
      {
        id: "P4", title: "Xây dựng 4 Content Pillars",
        desc: "Thiết kế ma trận nội dung giúp cân bằng giữa giáo dục, giải trí và bán hàng.",
        template: `Tôi đang xây dựng kênh [channel] cho thương hiệu [brandName].
Sản phẩm: [product]. Insight: [insight].

Hãy thiết kế 4 Content Pillars (Trụ cột nội dung) theo nguyên tắc:
1. Educate (Giáo dục thị trường).
2. Entertain (Giải trí, giữ chân).
3. Engage (Tương tác, tạo cộng đồng).
4. Sell (Bán hàng, chốt sale).

Với mỗi Pillar, hãy đưa ra:
- Tỷ lệ % phân bổ thời lượng/ngân sách.
- 3 ví dụ về tiêu đề/chủ đề cụ thể.
Đảm bảo tone of voice phù hợp với định vị: [positioning].`
      }
    ]
  },
  {
    id: 4, name: "Kịch bản chi tiết (Scripting)", short: "Scripting",
    desc: "Từ ý tưởng thành kịch bản từng frame, sẵn sàng để quay/dựng.",
    prompts: [
      {
        id: "P5", title: "Kịch bản Video ngắn (TikTok/Reels)",
        desc: "Cấu trúc 4 phần giữ chân người xem từ 3 giây đầu tiên.",
        template: `Hãy viết 1 kịch bản video ngắn (dưới 60s) để đăng lên [channel] cho thương hiệu [brandName].
Chủ đề dựa trên 1 nỗi đau từ P1. 

Cấu trúc kịch bản yêu cầu bảng 3 cột (Thời lượng | Hình ảnh/Góc máy | Lời thoại/Text):
- Hook (0-3s): Giật gân, chạm ngay nỗi đau.
- Body (3-45s): Nêu vấn đề và đưa ra giải pháp (sản phẩm [product]).
- Climax (45-50s): Chứng minh/Review/Show kết quả.
- CTA (50-60s): Kêu gọi hành động rõ ràng.

Tone & Mood: Năng động, thu hút tệp [persona].`
      },
      {
        id: "P6", title: "Bài viết chuẩn SEO / PR",
        desc: "Bài viết dài xây dựng uy tín, cung cấp thông tin chuyên sâu.",
        template: `Hãy viết 1 bài Blog/PR Article dài khoảng 800 - 1000 chữ về chủ đề: "Giải pháp giải quyết [chọn 1 nỗi đau] cho [persona]".
Yêu cầu:
1. Có tiêu đề chuẩn SEO, giật tít nhưng không clickbait.
2. Đoạn Sapo hấp dẫn, tóm tắt giá trị bài viết.
3. Chia làm 3-4 Heading 2 (H2).
4. Khéo léo lồng ghép USP: [usp] vào phần giải pháp.
5. Lời kết và Call-to-action hướng về sản phẩm [product].`
      }
    ]
  },
  {
    id: 5, name: "Tối ưu phân phối (Distribution)", short: "Distribution",
    desc: "Giật tít, caption và hashtag để tối đa hóa lượt tiếp cận.",
    prompts: [
      {
        id: "P7", title: "Bộ 10 Hook & Headline cực dính",
        desc: "10 biến thể tiêu đề cho cùng 1 nội dung để A/B testing.",
        template: `Dựa trên nội dung kịch bản/bài viết ở trên, tôi cần 10 biến thể Headline/Hook để làm A/B Testing trên kênh [channel].
Áp dụng 5 công thức sau (mỗi công thức 2 biến thể):
1. How-to (Làm thế nào để...).
2. Fear of Missing Out - FOMO (Đừng bỏ lỡ...).
3. Con số (Top X cách, X sai lầm...).
4. Đặt câu hỏi kích thích trí tò mò.
5. Kể chuyện (Storytelling - Tôi đã làm được... như thế nào).

Tất cả phải nhắm thẳng vào insight: [insight].`
      },
      {
        id: "P8", title: "Caption & Hashtag đa nền tảng",
        desc: "Tối ưu text đi kèm để chuẩn thuật toán từng kênh.",
        template: `Từ bài viết/kịch bản đã có, hãy tối ưu thành 2 phiên bản Caption khác nhau:
1. Phiên bản Facebook Fanpage: Kể chuyện, dùng icon hợp lý, giãn dòng dễ nhìn.
2. Phiên bản TikTok/Reels/Shorts: Ngắn gọn, có CTA mạnh, 1-2 câu đầu phải giật gân để họ đọc tiếp.

Và cung cấp bộ Hashtag chia làm 3 nhóm:
- Nhóm rộng (Broad): 3 thẻ.
- Nhóm ngách (Niche): 3 thẻ về [industry].
- Nhóm thương hiệu (Brand): 2 thẻ cho [brandName].`
      }
    ]
  }
];

const BONUS_TIPS = [
  { title: "Giao tiếp như con người", text: "Đừng coi AI là máy móc. Hãy ra lệnh như bạn đang hướng dẫn một thực tập sinh: cho họ bối cảnh, mục tiêu và ví dụ cụ thể." },
  { title: "Cung cấp đủ Context (Bối cảnh)", text: "Prompt càng có nhiều dữ liệu thật (Sản phẩm, Target Audience, USP), output của AI càng sắc bén và ít sáo rỗng." },
  { title: "Quy định rõ Format (Định dạng)", text: "Luôn nói rõ bạn muốn kết quả dưới dạng Bảng, Bullet point, hay Kịch bản 3 cột để AI không đoán mò." },
  { title: "One-shot / Few-shot Prompting", text: "Muốn AI viết theo một giọng văn cụ thể? Hãy paste 1-2 đoạn văn mẫu của bạn vào prompt để AI học theo." },
  { title: "Prompt chuỗi (Chain-of-thought)", text: "Thay vì bắt AI làm bài văn dài từ đầu, hãy bảo nó lập dàn ý trước. Bạn duyệt dàn ý xong mới bảo nó viết chi tiết." },
  { title: "Phân vai (Role-playing)", text: "Bắt đầu bằng 'Hãy đóng vai một Copywriter 10 năm kinh nghiệm...' giúp AI chọn lọc từ vựng chuyên môn tốt hơn." },
  { title: "Liên tục tinh chỉnh (Refine)", text: "Kết quả đầu tiên hiếm khi hoàn hảo. Hãy phản hồi: 'Ngắn lại', 'Bớt dùng từ đao to búa lớn', 'Nhấn mạnh hơn vào giá trị...'." },
  { title: "Quy tắc 'Rác vào - Rác ra'", text: "Nếu bạn không rõ USP của mình là gì, AI cũng chỉ có thể bịa ra những từ khóa chung chung như 'Chất lượng cao', 'Uy tín'." }
];

/* =========================================================================
   APP LOGIC
   ========================================================================= */

// Trạng thái dự án lưu trong LocalStorage
let projectData = JSON.parse(localStorage.getItem('fua_projectData')) || {};
let promptProgress = JSON.parse(localStorage.getItem('fua_promptProgress')) || {};

// DOM Elements
const fEls = {
  brandName: document.getElementById('f-brandName'),
  product: document.getElementById('f-product'),
  industry: document.getElementById('f-industry'),
  market: document.getElementById('f-market'),
  businessModel: document.getElementById('f-businessModel'),
  pricing: document.getElementById('f-pricing'),
  persona: document.getElementById('f-persona'),
  channel: document.getElementById('f-channel'),
  budget: document.getElementById('f-budget'),
  bigIdea: document.getElementById('f-bigIdea'),
  usp: document.getElementById('f-usp'),
  insight: document.getElementById('f-insight'),
  positioning: document.getElementById('f-positioning')
};
const stagesContainer = document.getElementById('stagesContainer');
const flowGrid = document.getElementById('flowGrid');
const tipsGrid = document.getElementById('tipsGrid');
const progressCount = document.getElementById('progressCount');
const progressFill = document.getElementById('progressFill');
const toastEl = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');
const topbar = document.getElementById('topbar');

let saveTimeout = null;

// Khởi tạo
function init() {
  loadFormData();
  renderFlowCards();
  renderStages();
  renderTips();
  updateProgress();
  setupEventListeners();
  
  // Xử lý scroll header
  window.addEventListener('scroll', () => {
    if (window.scrollY > 20) topbar.classList.add('scrolled');
    else topbar.classList.remove('scrolled');
  });
}

// Render tổng quan
function renderFlowCards() {
  flowGrid.innerHTML = '';
  STAGES.forEach(s => {
    const isStageDone = s.prompts.every(p => promptProgress[p.id]);
    const card = document.createElement('a');
    card.href = `#stage-${s.id}`;
    card.className = 'flow-card';
    card.setAttribute('data-stage', s.id);
    card.innerHTML = `
      <div class="flow-card-num">0${s.id}</div>
      <div class="flow-card-label">Giai đoạn</div>
      <div class="flow-card-title">${s.name}</div>
      <div class="flow-card-sub">${s.desc}</div>
      <div class="flow-card-foot">
        <span>${s.prompts.length} Prompt</span>
        ${isStageDone ? `<span class="flow-card-status done">Hoàn thành</span>` : `<span class="flow-card-status">Chưa xong</span>`}
      </div>
    `;
    flowGrid.appendChild(card);
  });
}

// Render chi tiết
function renderStages() {
  stagesContainer.innerHTML = '';
  let globalPromptIdx = 1;

  STAGES.forEach(stage => {
    const stageDiv = document.createElement('div');
    stageDiv.className = 'stage-block';
    stageDiv.id = `stage-${stage.id}`;
    
    // Tính số prompt hoàn thành trong stage
    const totalS = stage.prompts.length;
    const doneS = stage.prompts.filter(p => promptProgress[p.id]).length;

    // Header của Stage
    const sHead = document.createElement('div');
    sHead.className = 'stage-head';
    sHead.setAttribute('data-stage', stage.id);
    sHead.innerHTML = `
      <div class="stage-head-num">${stage.id}</div>
      <div class="stage-head-text">
        <div class="stage-head-label">Giai đoạn ${stage.id}</div>
        <div class="stage-head-title">${stage.name}</div>
        <div class="stage-head-sub">${stage.desc}</div>
      </div>
      <div class="stage-head-stats">
        <div class="stage-head-progress">${doneS}<span>/${totalS}</span></div>
        <div class="stage-head-progress-label">Hoàn thành</div>
      </div>
    `;
    stageDiv.appendChild(sHead);

    // Render Prompts
    stage.prompts.forEach(p => {
      const isDone = !!promptProgress[p.id];
      const pNotes = promptProgress[`${p.id}_notes`] || '';
      
      const pCard = document.createElement('div');
      pCard.className = `prompt-card ${isDone ? 'done expanded' : ''}`;
      pCard.id = `prompt-${p.id}`;

      // Điền data vào template
      let filledTemplate = p.template;
      let missingKeys = [];
      Object.keys(fEls).forEach(k => {
        const val = projectData[k] ? projectData[k].trim() : '';
        const regex = new RegExp(`\\[${k}\\]`, 'g');
        if (filledTemplate.match(regex)) {
          if (val) {
            filledTemplate = filledTemplate.replace(regex, `<span class="filled">${val}</span>`);
          } else {
            missingKeys.push(k);
            filledTemplate = filledTemplate.replace(regex, `<span class="placeholder">[${k}]</span>`);
          }
        }
      });

      let statusHtml = '';
      if (missingKeys.length > 0) {
        statusHtml = `<span class="fill-status warn"><span class="dot"></span>Thiếu ${missingKeys.length} thông tin</span>`;
      } else {
        statusHtml = `<span class="fill-status"><span class="dot"></span>Đã cá nhân hóa 100%</span>`;
      }

      pCard.innerHTML = `
        <div class="prompt-head">
          <div class="prompt-id">P${globalPromptIdx}</div>
          <div class="prompt-head-text">
            <div class="prompt-meta"><strong>Bước ${stage.id}</strong> — ${stage.short}</div>
            <div class="prompt-title">${p.title}</div>
          </div>
          <div class="prompt-head-actions">
            <button class="check-toggle ${isDone ? 'checked' : ''}" data-pid="${p.id}">
              <span class="check-icon"></span>
              ${isDone ? 'Đã chạy xong' : 'Đánh dấu xong'}
            </button>
            <button class="expand-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
          </div>
        </div>
        <div class="prompt-body">
          <p style="font-size:14px; color:var(--ink-2); line-height:1.5; margin-bottom:16px;">${p.desc}</p>
          <div class="code-section">
            <div class="code-head">
              <div class="code-head-label" data-stage="${stage.id}">Câu lệnh (Prompt) dành cho AI</div>
              ${statusHtml}
            </div>
            <div class="code-block" id="code-${p.id}">
              ${filledTemplate}
              <button class="copy-btn" data-pid="${p.id}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy
              </button>
            </div>
          </div>
          <div class="tip-box">
            <div class="tip-box-icon">💡</div>
            <div class="tip-box-text">
              <strong>Mẹo thực thi:</strong> Copy khối lệnh trên, dán vào ChatGPT / Claude / Gemini. Nếu output chưa ưng ý, hãy yêu cầu AI sửa lại theo ý bạn (VD: "Ngắn hơn", "Giọng điệu hài hước hơn").
            </div>
          </div>
          <div class="notes-section">
            <label>Ghi chú / Kết quả ưng ý nhất (Lưu tại đây để xem lại sau)</label>
            <textarea id="notes-${p.id}" rows="3" placeholder="Paste câu trả lời hay nhất của AI vào đây...">${pNotes}</textarea>
          </div>
        </div>
      `;
      
      stageDiv.appendChild(pCard);
      globalPromptIdx++;

      // Events
      const head = pCard.querySelector('.prompt-head');
      const checkBtn = pCard.querySelector('.check-toggle');
      const copyBtn = pCard.querySelector('.copy-btn');
      const notesEl = pCard.querySelector(`#notes-${p.id}`);

      // Mở/đóng
      head.addEventListener('click', (e) => {
        if (e.target.closest('.check-toggle')) return;
        pCard.classList.toggle('expanded');
      });

      // Tick hoàn thành
      checkBtn.addEventListener('click', () => {
        const pid = checkBtn.dataset.pid;
        const isCurrentlyDone = !!promptProgress[pid];
        if (isCurrentlyDone) {
          delete promptProgress[pid];
          checkBtn.classList.remove('checked');
          checkBtn.innerHTML = `<span class="check-icon"></span> Đánh dấu xong`;
          pCard.classList.remove('done');
        } else {
          promptProgress[pid] = true;
          checkBtn.classList.add('checked');
          checkBtn.innerHTML = `<span class="check-icon"></span> Đã chạy xong`;
          pCard.classList.add('done');
          pCard.classList.add('expanded');
        }
        saveProgress();
        updateProgress();
        renderFlowCards(); // update header stats
        
        // Update stage header stats
        const dS = stage.prompts.filter(pt => promptProgress[pt.id]).length;
        sHead.querySelector('.stage-head-progress').innerHTML = `${dS}<span>/${totalS}</span>`;
      });

      // Copy
      copyBtn.addEventListener('click', () => {
        // Lấy text thô bỏ HTML tags
        let textToCopy = filledTemplate.replace(/<[^>]*>?/gm, '');
        navigator.clipboard.writeText(textToCopy).then(() => {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Copied!`;
          showToast('Đã copy prompt vào Clipboard');
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
          }, 2000);
        });
      });

      // Ghi chú
      notesEl.addEventListener('input', () => {
        promptProgress[`${p.id}_notes`] = notesEl.value;
        debouncedSave();
      });
    });

    stagesContainer.appendChild(stageDiv);
  });
}

function renderTips() {
  tipsGrid.innerHTML = '';
  BONUS_TIPS.forEach((tip, idx) => {
    const t = document.createElement('div');
    t.className = 'bonus-card';
    t.innerHTML = `
      <div class="bonus-card-num">0${idx+1}</div>
      <div class="bonus-card-content">
        <div class="bonus-card-title">${tip.title}</div>
        <div class="bonus-card-text">${tip.text}</div>
      </div>
    `;
    tipsGrid.appendChild(t);
  });
}

// Xử lý Form
function loadFormData() {
  Object.keys(fEls).forEach(k => {
    if (projectData[k]) {
      fEls[k].value = projectData[k];
    }
  });
}

function setupEventListeners() {
  // Bắt sự kiện nhập form -> tự lưu sau 1s -> render lại prompt
  Object.keys(fEls).forEach(k => {
    fEls[k].addEventListener('input', () => {
      document.getElementById('saveStatusText').textContent = 'Đang lưu...';
      projectData[k] = fEls[k].value;
      debouncedSave(true);
    });
  });

  // Nút xóa form
  document.getElementById('clearFormBtn').addEventListener('click', () => {
    if(confirm('Xóa trắng thông tin form dự án? (Không mất kết quả prompt)')) {
      projectData = {};
      Object.values(fEls).forEach(el => el.value = '');
      saveData();
      renderStages();
      showToast('Đã xóa trắng form');
    }
  });

  // Nút cuộn
  document.getElementById('scrollToPromptsBtn').addEventListener('click', () => {
    document.getElementById('stages-section').scrollIntoView({behavior: 'smooth'});
  });

  // Export JSON
  document.getElementById('exportBtn').addEventListener('click', () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
      info: projectData,
      progress: promptProgress
    }, null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", `freeup_prompt_data_${Date.now()}.json`);
    dlAnchorElem.click();
    showToast('Đã tải xuống file Backup JSON');
  });

  // Nút Reset
  document.getElementById('resetBtn').addEventListener('click', () => {
    if(confirm('Xóa TOÀN BỘ thông tin, tiến độ và ghi chú? Không thể khôi phục.')) {
      projectData = {};
      promptProgress = {};
      localStorage.removeItem('fua_projectData');
      localStorage.removeItem('fua_promptProgress');
      loadFormData();
      init();
      showToast('Đã xóa toàn bộ dữ liệu');
      window.scrollTo(0,0);
    }
  });
}

function debouncedSave(reRender = false) {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    saveData();
    if(reRender) renderStages();
    document.getElementById('saveStatusText').textContent = 'Đã lưu';
  }, 1000);
}

function saveData() {
  localStorage.setItem('fua_projectData', JSON.stringify(projectData));
  saveProgress();
}

function saveProgress() {
  localStorage.setItem('fua_promptProgress', JSON.stringify(promptProgress));
}

function updateProgress() {
  const total = STAGES.reduce((sum, s) => sum + s.prompts.length, 0);
  let done = 0;
  STAGES.forEach(s => {
    s.prompts.forEach(p => {
      if (promptProgress[p.id]) done++;
    });
  });
  
  progressCount.textContent = done;
  const pct = Math.round((done / total) * 100);
  progressFill.style.width = `${pct}%`;
}

// Toast UI
function showToast(msg) {
  toastMsg.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 3000);
}

// Khởi chạy
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
